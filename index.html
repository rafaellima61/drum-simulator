<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Drum Game</title>
</head>
<body>
    <h1>🥁  Drum Game   🥁
    </h1>
    <div class="grid-container">
        <div class="grid-item">
            <img src="./images/tom1.png" alt="tom1">
            <button id="w">W</button>
        </div>
        <div class="grid-item">
            <img src="./images/tom2.png" alt="tom2">
            <button id="a">A</button>
        </div>
        <div class="grid-item">
            <img src="./images/tom3.png" alt="tom3">
            <button id="s">S</button>
        </div>
        <div class="grid-item">
            <img src="./images/tom4.png" alt="tom4">
            <button id="d">D</button>
        </div>
        <div class="grid-item">
            <img src="./images/snare.png" alt="snare">
            <button id="j">J</button>
        </div>
        <div class="grid-item">
            <img src="./images/crash.png" alt="crash">
            <button id="k">K</button>
        </div>
        <div class="grid-item">
            <img src="./images/kick.png" alt="kick">
            <button id="l">L</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
